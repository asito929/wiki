<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">구독 이모티콘 이미지 자리</title>
  <desc id="desc">아시토의 구독 이모티콘 모음 이미지를 넣기 위한 자리 표시 이미지</desc>
  <rect width="900" height="600" fill="#f4f5f8"/>
  <g fill="#e1e4ea">
    <circle cx="250" cy="260" r="90"/><circle cx="450" cy="260" r="90"/><circle cx="650" cy="260" r="90"/>
  </g>
  <text x="450" y="455" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#6b7280">구독 이모티콘</text>
  <text x="450" y="500" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9298a3">이미지를 교체해 주세요</text>
</svg>
